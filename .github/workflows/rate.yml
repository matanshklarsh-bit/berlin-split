name: Update EUR rate
on:
  schedule:
    - cron: '50 13 * * 0-5'   # after Bank of Israel publishes (~15:30 Israel time)
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Bank of Israel representative rate
        run: |
          curl -sf "https://boi.org.il/PublicApi/GetExchangeRates?asJson=true" -o boi.json
          python3 - <<'EOF'
          import json
          j = json.load(open('boi.json'))
          e = next(x for x in j['exchangeRates'] if x['key'] == 'EUR')
          v = float(e['currentExchangeRate'])
          assert 2 < v < 7
          json.dump({'value': v, 'date': str(e.get('lastUpdate', ''))[:10]}, open('rate.json', 'w'))
          EOF
          rm boi.json
      - name: Commit if changed
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rate.json
          git diff --cached --quiet || (git commit -m "Update EUR rate" && git push)
